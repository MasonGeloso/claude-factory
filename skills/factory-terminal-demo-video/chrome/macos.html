<!doctype html><html><head><meta charset="utf-8"><title>terminal demo</title>
<link rel="stylesheet" href="node_modules/asciinema-player/dist/bundle/asciinema-player.css">
<style>
@font-face{font-family:'UI';src:url('fonts/Inter-1.ttf');font-weight:400}
@font-face{font-family:'UI';src:url('fonts/Inter-2.ttf');font-weight:500}
@font-face{font-family:'UI';src:url('fonts/Inter-3.ttf');font-weight:600}
@font-face{font-family:'JBMono';src:url('fonts/JetBrainsMono-Regular.ttf');font-weight:400}
@font-face{font-family:'JBMono';src:url('fonts/JetBrainsMono-Bold.ttf');font-weight:700}
*{margin:0;padding:0;box-sizing:border-box}
html{--sq:url(#squircle)}
html,body{width:2560px;height:1440px;overflow:hidden;background:#07070f}
body.nochrome .chrome{display:none!important}

/* ---------- wallpaper: broad soft colour fields, the way macOS ships them ---------- */
#desk{position:absolute;inset:0;overflow:hidden;background:#0d0a1c}
/* Sequoia-ish: a few very wide, very soft colour fields on a deep base. Conic + radial
   layers keep the falloff smooth so there is no visible banding at 1440p. */
#desk::before{content:'';position:absolute;inset:-18%;
  background:
   radial-gradient(46% 38% at 16% 10%,  rgba(255,176,120,.92) 0%, transparent 68%),
   radial-gradient(52% 44% at 74% 4%,   rgba(214,116,222,.90) 0%, transparent 70%),
   radial-gradient(58% 50% at 96% 34%,  rgba(126, 82,236,.92) 0%, transparent 72%),
   radial-gradient(64% 54% at 30% 52%,  rgba( 62, 96,232,.90) 0%, transparent 72%),
   radial-gradient(70% 58% at 88% 84%,  rgba( 34,176,214,.88) 0%, transparent 72%),
   radial-gradient(66% 56% at 18% 96%,  rgba( 96, 54,196,.90) 0%, transparent 72%),
   radial-gradient(48% 40% at 52% 74%,  rgba(150, 70,200,.55) 0%, transparent 70%);
  filter:blur(42px) saturate(118%)}
#desk::after{content:'';position:absolute;inset:0;
  background:radial-gradient(118% 102% at 50% 42%,transparent 40%,rgba(6,5,18,.58) 100%);}

/* ---------- menu bar ---------- */
#menubar{position:absolute;top:0;left:0;right:0;height:37px;z-index:3;
  display:flex;align-items:center;gap:28px;padding:0 32px;
  font:500 17px/1 'UI','Noto Sans CJK JP','Hiragino Sans',-apple-system,sans-serif;color:rgba(255,255,255,.93);
  background:rgba(22,20,32,.34);backdrop-filter:blur(26px) saturate(150%);
  -webkit-backdrop-filter:blur(26px) saturate(150%);
  box-shadow:inset 0 -1px 0 rgba(255,255,255,.07)}
#menubar .apple{width:17px;height:20px;margin-right:4px;opacity:.95;
  background:#fff;-webkit-mask:var(--apple) center/contain no-repeat;mask:var(--apple) center/contain no-repeat}
#menubar b{font-weight:600}
#menubar .sp{margin-left:auto;display:flex;align-items:center;gap:22px;font-weight:400}
#menubar svg{display:block}

/* ---------- window ---------- */
@keyframes winIn{
  0%  {opacity:0;transform:translate(-50%,-47.5%) scale(.955)}
  60% {opacity:1}
  100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
#win{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  animation:winIn .66s cubic-bezier(.19,.9,.22,1) both;animation-play-state:paused;
  width:max-content;border-radius:12px;overflow:hidden;z-index:2;
  box-shadow:
    0 0 0 .5px rgba(0,0,0,.55),
    0 0 0 1.5px rgba(255,255,255,.09),
    0 2px 6px rgba(0,0,0,.30),
    0 14px 34px rgba(0,0,0,.34),
    0 46px 110px rgba(0,0,0,.60);}
#bar{height:52px;display:flex;align-items:center;position:relative;padding:0 20px;
  background:linear-gradient(180deg,rgba(58,55,70,.62),rgba(40,38,50,.58));
  backdrop-filter:blur(44px) saturate(180%);
  -webkit-backdrop-filter:blur(44px) saturate(180%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10), inset 0 -1px 0 rgba(0,0,0,.40)}
#bar .lights{display:flex;gap:8px}
#bar .l{width:13px;height:13px;border-radius:50%}
.l.r{background:radial-gradient(circle at 34% 28%,#ff8a80,#ec5f55 62%);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.30)}
.l.y{background:radial-gradient(circle at 34% 28%,#ffd868,#e5a922 62%);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.30)}
.l.g{background:radial-gradient(circle at 34% 28%,#5ce072,#1fb739 62%);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.30)}
#bar .t{position:absolute;left:0;right:0;text-align:center;pointer-events:none;
  font:600 15px/1 'UI','Noto Sans CJK JP','Hiragino Sans',-apple-system,sans-serif;letter-spacing:.008em;
  color:rgba(240,237,230,.80)}
/* the terminal body: THIS is the frosted glass */
#glass{width:max-content;background:rgba(9,11,17,.88);backdrop-filter:blur(34px) saturate(135%);
  -webkit-backdrop-filter:blur(34px) saturate(135%);padding:10px 16px 16px}

/* asciinema-player: let the glass show through, use our font */
#term,#term .ap-wrapper{width:max-content}
#term .ap-wrapper,#term .ap-player{background:transparent!important;box-shadow:none!important}
#term .ap-term{border:0!important;
  font-family:'JBMono','JetBrains Mono',monospace!important;
  font-variant-ligatures:none;
  line-height:1.36!important;text-shadow:0 1px 3px rgba(0,0,0,.85),0 0 12px rgba(0,0,0,.55)}
#term .ap-control-bar,#term .ap-overlay{display:none!important}
#term pre,#term .ap-line{background:transparent!important}

/* ---------- dock ---------- */
#dock{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);z-index:3;
  display:flex;align-items:flex-end;gap:14px;padding:13px 19px;border-radius:27px;
  background:rgba(226,228,240,.20);backdrop-filter:blur(44px) saturate(180%);
  -webkit-backdrop-filter:blur(44px) saturate(180%);
  box-shadow:0 0 0 .5px rgba(255,255,255,.22), 0 18px 44px rgba(0,0,0,.42),
             inset 0 1px 0 rgba(255,255,255,.24)}
#dock .app{width:64px;height:64px;display:block;
  filter:drop-shadow(0 3px 6px rgba(0,0,0,.40))}
#dock .run{position:relative}
#dock .run::after{content:'';position:absolute;left:50%;bottom:-9px;width:5px;height:5px;
  transform:translateX(-50%);border-radius:50%;background:rgba(240,240,248,.88)}
#dock .sep{width:1px;height:52px;margin:0 3px;background:rgba(255,255,255,.24);align-self:center}
/* terminal palette. Override these tokens per project — and VERIFY they applied
   (see chrome/README.md): a <style> in the wrong place is silently ignored. */
:root, #term .asciinema-player-theme-demo, #term .ap-player{
  --term-color-foreground:#e7e2d6; --term-color-background:rgba(9,11,16,.58);
  --term-color-0:#171b1e; --term-color-1:#e08d7d; --term-color-2:#a3c58c; --term-color-3:#dcb76d;
  --term-color-4:#93b6cd; --term-color-5:#c69fbf; --term-color-6:#92c7c0; --term-color-7:#e7e2d6;
  --term-color-8:#252a2f; --term-color-9:#e59a8c; --term-color-10:#b6d69e; --term-color-11:#e8cb89;
  --term-color-12:#a9c8de; --term-color-13:#d7b1cf; --term-color-14:#a9d8d1; --term-color-15:#ffffff;
}

<script>
document.documentElement.style.setProperty('--apple',
  "url(\"data:image/svg+xml;utf8," + encodeURIComponent(
   '<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 26 32\"><path d=\"M20.4 17c0-4 3.2-5.9 3.3-6-1.8-2.7-4.6-3-5.6-3.1-2.6-.2-4.8 1.4-6 1.4-1.3 0-3.1-1.4-5.1-1.3C4.3 8 1.9 9.6.6 12.1c-2.6 4.6-.7 11.3 1.9 15 1.3 1.8 2.8 3.8 4.8 3.7 1.9-.1 2.6-1.2 4.9-1.2s2.9 1.2 4.9 1.2c2 0 3.3-1.8 4.6-3.6 1.4-2 2-4 2-4.1-.1 0-3.3-1.3-3.3-5.1zM16.6 5.3C17.7 4 18.4 2.2 18.2.4c-1.6.1-3.5 1.1-4.6 2.4-1 1.1-1.8 3-1.6 4.7 1.8.2 3.6-.9 4.6-2.2z\" fill=\"black\"/></svg>')+"\")");
/* ------------------------------------------------------------------
   Chrome strings. This is the ONLY place the demo's language lives — the
   recorded CLI's own TUI is almost never localisable, but the desktop
   around it is your own CSS and must match, or the frame reads as an
   English desktop with a foreign-language app sitting inside it.
   ------------------------------------------------------------------ */
const CHROME = {
  locale : 'ja-JP',
  menu   : ['ターミナル','シェル','編集','表示','ウインドウ','ヘルプ'],
  // Apple writes ウインドウ, not ウィンドウ. A native speaker notices immediately.
  title  : 'claude',
  cols   : 92, rows : 30,
  clock  : d => `${d.getMonth()+1}月${d.getDate()}日(${'日月火水木金土'[d.getDay()]}) `
              + `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`
};
(function paint(){
  const m = CHROME.menu;
  document.getElementById('mb-app').textContent = m[0];
  for (let i = 1; i < 6; i++) {
    const el = document.getElementById('mb-'+i);
    if (el) el.textContent = m[i] || '';
  }
  // Compute the weekday; never hand-write the character.
  document.getElementById('mb-clock').textContent = CHROME.clock(new Date());
  // Terminal.app's title is "<title> — <cols>×<rows>".
  document.getElementById('win-title').textContent =
    `${CHROME.title} — ${CHROME.cols}×${CHROME.rows}`;
})();

window.__DONE__=false; window.__START__=false;
window.startDemo=function(){window.__START__=true};
const CAST = 'final.cast';
const player = window.__player__ = AsciinemaPlayer.create(CAST, document.getElementById('term'), {
  cols: 92, rows: 30,
  autoPlay: false, controls: false, loop: false,
  terminalFontFamily: "'JBMono','JetBrains Mono',monospace",
  terminalFontSize: '24px',
  terminalLineHeight: 1.36,
  fit: false,
  theme: 'demo'
});
(async () => {
  while(!window.__START__) await new Promise(r=>setTimeout(r,16));
  document.getElementById('hold')?.remove();
  document.getElementById('win').style.animationPlayState='running';
  player.play();
  // hold the finished screen on camera before the end marker goes up
  player.addEventListener('ended', () => setTimeout(() => {
    const e=document.createElement('div');
    e.id='endmark';
    e.style.cssText='position:absolute;inset:0;background:#FF00FF;z-index:99';
    document.body.appendChild(e);
    window.__DONE__=true;
  }, 9500));
})();
</script>
<div id="hold" style="position:absolute;inset:0;background:#FF00FF;z-index:99"></div>

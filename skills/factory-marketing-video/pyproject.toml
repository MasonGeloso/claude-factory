[project]
name = "factory-marketing-video"
version = "0.1.0"
description = "Conversation-driven video editor skill for Claude Code, vendored from video-use with a dubbing pipeline and YouTube publishing/shorts workflow added"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "requests",
    "librosa",
    "matplotlib",
    "pillow",
    "numpy",
]

[project.optional-dependencies]
animations = ["manim"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []
